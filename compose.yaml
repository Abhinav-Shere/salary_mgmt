name: salary_mgmt

services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile.dev
      labels:
        com.salary-mgmt: "true"
    image: salary_mgmt-api:dev
    container_name: salary_mgmt_api
    labels:
      com.salary-mgmt: "true"
    environment:
      BUNDLE_USER_HOME: /usr/local/bundle/home
      DATABASE_DIR: /data
    ports:
      - "127.0.0.1:${API_PORT:-3200}:3000"
    volumes:
      - ./api:/app
      - bundle:/usr/local/bundle
      - storage:/data
    mem_limit: 512m
    memswap_limit: 512m

  web:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
      labels:
        com.salary-mgmt: "true"
    image: salary_mgmt-web:dev
    container_name: salary_mgmt_web
    labels:
      com.salary-mgmt: "true"
    environment:
      API_URL: http://api:3000
    ports:
      - "127.0.0.1:${WEB_PORT:-5180}:5180"
    volumes:
      - ./web:/app
    mem_limit: 512m
    memswap_limit: 512m
    depends_on:
      - api

  editor:
    image: salary_mgmt-web:dev
    container_name: salary_mgmt_editor
    labels:
      com.salary-mgmt: "true"
    profiles:
      - editor
    command: sleep infinity
    volumes:
      - .:/workspace
    mem_limit: 768m
    memswap_limit: 768m

volumes:
  bundle:
    name: salary_mgmt_bundle
    labels:
      com.salary-mgmt: "true"
  storage:
    name: salary_mgmt_storage
    labels:
      com.salary-mgmt: "true"

networks:
  default:
    name: salary_mgmt_net
    labels:
      com.salary-mgmt: "true"
