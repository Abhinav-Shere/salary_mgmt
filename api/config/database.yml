default: &default
  adapter: sqlite3
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  <<: *default
  database: <%= ENV.fetch("DATABASE_DIR", "storage") %>/development.sqlite3

test:
  <<: *default
  database: <%= ENV.fetch("DATABASE_DIR", "storage") %>/test.sqlite3

production:
  <<: *default
  database: <%= ENV.fetch("DATABASE_DIR", "storage") %>/production.sqlite3
